<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fiches coaching — La Forge</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="icon" href="/la-forge/img/forge-anvil.png" type="image/png" />
  <link rel="stylesheet" href="/la-forge/css/main.css" />
  <link rel="stylesheet" href="/la-forge/css/forge-coaching-fiches.css" />
</head>
<body>
  <header class="site-header" data-forge-member-header="coaching-fiches"></header>

  <div class="container" style="max-width:960px">
    <div class="cf-hero">
      <span class="forge-hero-tag">Espace coach · suivi 1:1</span>
      <h1>Fiches de suivi coaching</h1>
      <p>
        Remplis la fiche après chaque coaching. Les <strong>annotations coach</strong> restent privées.
        Quand tu veux transmettre à l’élève, active le partage et envoie le lien. Tu peux aussi <strong>voir</strong> et <strong>télécharger</strong> la synthèse élève.
      </p>
    </div>

    <div id="coaching-fiches-root">
      <p class="cf-muted">Chargement…</p>
    </div>
  </div>

  <script src="/la-forge/js/forge-brand.js"></script>
  <script src="/la-forge/js/auth.js"></script>
  <script src="/la-forge/js/forge-gate.js"></script>
  <script src="/la-forge/js/forge-coaching-fiches.js"></script>
  <script>
    (function () {
      var root = document.getElementById("coaching-fiches-root");
      function fail(msg) {
        if (root) root.innerHTML = '<p class="cf-empty card">' + msg + "</p>";
      }
      if (typeof getMe !== "function") {
        fail("Script auth manquant — redéploie DEPLOY-COACHING-FICHES.sh puis hard refresh.");
        return;
      }
      initForgeGate({ requirePremium: false })
        .then(function (me) {
          if (!me) {
            fail("Redirection connexion…");
            return;
          }
          return initCoachingFiches(me);
        })
        .catch(function (err) {
          fail("Erreur : " + (err && err.message ? err.message : String(err)));
        });
    })();
  </script>
</body>
</html>

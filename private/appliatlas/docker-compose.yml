services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      API_PORT: 3001
      DATABASE_URL: "file:/data/prod.db"
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?ADMIN_TOKEN requis}
    volumes:
      - api-data:/data
    restart: unless-stopped

  # PostgreSQL (à activer lors de la migration depuis SQLite) :

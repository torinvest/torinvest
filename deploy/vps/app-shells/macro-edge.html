<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Macro Edge — SMT Monitor — La Forge</title>
  <meta name="robots" content="noindex,nofollow" />
  <meta name="description" content="TORINVEST Macro Edge — dashboard pédagogique Gold Desk : drivers macro, corrélations, SMT, décomposition des taux." />
  <link rel="icon" href="/img/forge-anvil.png" type="image/png" />
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/forge-macro-edge.css?v=1" />
</head>
<body>
  <header class="site-header" data-forge-member-header="macro-edge"></header>

  <div class="container" style="max-width:1180px">
    <div id="macro-edge-root">
      <p class="me-loading">Chargement…</p>
    </div>
  </div>

  <footer data-forge-footer></footer>

  <script src="/js/forge-brand.js"></script>
  <script src="/js/auth.js?v=8"></script>
  <script src="/js/forge-gate.js"></script>
  <script src="/js/forge-macro-edge.js?v=1"></script>
  <script>
    (function () {
      var root = document.getElementById("macro-edge-root");
      function fail(msg) {
        if (root) root.innerHTML = '<p class="me-loading">' + msg + "</p>";
      }
      if (typeof getMe !== "function") {
        fail("Script auth manquant — redéploie puis hard refresh.");
        return;
      }
      initForgeGate({ requirePremium: true })
        .then(function (me) {
          if (!me) {
            fail("Redirection connexion…");
            return;
          }
          return initMacroEdge();
        })
        .catch(function (err) {
          fail("Erreur : " + (err && err.message ? err.message : String(err)));
        });
    })();
  </script>
  <script src="/js/forge-legal.js"></script>
</body>
</html>

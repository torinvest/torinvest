<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Changer mon mot de passe — TORINVEST La Forge</title>
  <link rel="icon" href="/img/forge-anvil.png" type="image/png" />
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/legal.css" />
</head>
<body>
  <header class="site-header" data-forge-member-header="compte"></header>

  <div class="container" style="max-width:440px;padding-top:2rem">
    <div class="card">
      <h2>Changer mon mot de passe</h2>
      <p style="margin-bottom:1rem;color:var(--muted);font-size:0.95rem;line-height:1.55">
        Réservé aux membres connectés. Tu peux aussi coller ta clé TOR comme « mot de passe actuel ».
      </p>
      <div id="alert" class="alert" hidden></div>
      <form id="change-form">
        <div class="form-group">
          <label for="currentPassword">Mot de passe actuel (ou clé TOR)</label>
          <input type="password" id="currentPassword" name="currentPassword" autocomplete="current-password" />
        </div>
        <div class="form-group">
          <label for="newPassword">Nouveau mot de passe (min. 8)</label>
          <input type="password" id="newPassword" name="newPassword" required minlength="8"
            autocomplete="new-password" />
        </div>
        <div class="form-group">
          <label for="newPassword2">Confirmer</label>
          <input type="password" id="newPassword2" name="newPassword2" required minlength="8"
            autocomplete="new-password" />
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;margin-top:0.5rem">
          Mettre à jour
        </button>
      </form>
      <p style="margin-top:1rem;font-size:0.85rem;color:var(--muted);text-align:center">
        <a href="/forgot-password.html">Mot de passe oublié (avec clé TOR)</a>
        · <a href="/dashboard.html">Tableau de bord</a>
      </p>
    </div>
  </div>

  <footer data-forge-footer></footer>
  <script src="/js/forge-brand.js"></script>
  <script src="/js/auth.js?v=8"></script>
  <script src="/js/forge-gate.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async function () {
      const me = await getMe();
      if (!me) {
        window.location.href = "/login.html?next=" + encodeURIComponent("/account-password.html");
        return;
      }
    });
    document.getElementById("change-form").addEventListener("submit", async function (e) {
      e.preventDefault();
      const alertEl = document.getElementById("alert");
      const newPassword = document.getElementById("newPassword").value;
      const newPassword2 = document.getElementById("newPassword2").value;
      if (newPassword !== newPassword2) {
        showAlert(alertEl, "Les deux mots de passe ne correspondent pas.");
        return;
      }
      try {
        await api("/api/change-password", {
          method: "POST",
          body: JSON.stringify({
            currentPassword: document.getElementById("currentPassword").value,
            newPassword: newPassword,
          }),
        });
        showAlert(alertEl, "Mot de passe mis à jour.", "success");
      } catch (err) {
        showAlert(alertEl, err.message || "Échec");
      }
    });
  </script>
  <script src="/js/forge-legal.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fondamental — La Forge Premium</title>
  <link rel="icon" href="/img/forge-anvil.png" type="image/png" />
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/legal.css" />
  <style>
    .fonda-hero { margin-bottom: 1rem; }
    .fonda-hero h1 { margin: 0.2rem 0; color: var(--gold); font-size: 1.35rem; }
    .fonda-hero p { color: var(--muted); font-size: 0.9rem; margin: 0.35rem 0 0; line-height: 1.55; }
    #fonda-frame-wrap {
      margin-top: 1rem;
      border: 1px solid rgba(255, 215, 0, 0.28);
      border-radius: 12px;
      overflow: hidden;
      background: #0a0c12;
      min-height: 70vh;
    }
    #fonda-frame {
      display: block;
      width: 100%;
      height: min(78vh, 900px);
      border: 0;
      background: #0a0c12;
    }
  </style>
</head>
<body>
  <header class="site-header" data-forge-member-header="fondamental"></header>

  <div class="container">
    <div class="fonda-hero">
      <span class="forge-hero-tag">Premium · application pédagogique</span>
      <h1>Fondamental</h1>
      <p>
        Macro, pricing et fondamentaux marchés — inclus dans votre abonnement La Forge Premium.
        Accès réservé aux membres Premium pour le moment.
      </p>
    </div>

    <div id="fonda-locked" class="alert alert-warn" hidden>
      Abonnement Premium requis.
      <a href="https://www.torinvest-trading.com/la-forge/pricing.html">Voir les tarifs La Forge</a>
    </div>

    <div id="fonda-status" class="alert" hidden></div>

    <div id="fonda-retry" hidden style="margin-top:0.75rem">
      <button type="button" class="btn btn-secondary" onclick="location.reload()">Réessayer</button>
    </div>

    <div id="fonda-frame-wrap" hidden>
      <iframe id="fonda-frame" title="Application Fondamental" loading="lazy"></iframe>
    </div>
  </div>

  <footer data-forge-footer></footer>

  <script src="/js/forge-brand.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/forge-gate.js"></script>
  <script src="/js/forge-fondamental.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Exercices chart élèves — La Forge</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="icon" href="/img/forge-anvil.png" type="image/png" />
  <link rel="stylesheet" href="/css/main.css" />
  <style>
    .cex-hero { margin: 1.5rem 0 1rem; }
    .cex-hero h1 { color: var(--gold); font-size: 1.6rem; margin: 0.35rem 0; }
    .cex-hero p { color: var(--muted); max-width: 42rem; }
    .cex-admin-list { display: grid; gap: 0.85rem; }
    .cex-admin-card {
      border: 1px solid rgba(255, 215, 0, 0.2);
      border-radius: 12px;
      padding: 0.9rem 1rem;
      background: rgba(0, 0, 0, 0.25);
    }
    .cex-admin-meta { color: var(--aqua); font-size: 0.9rem; margin-bottom: 0.35rem; }
    .cex-admin-preview { color: var(--text); font-size: 0.92rem; margin: 0.35rem 0; }
    .cex-admin-stats { color: var(--muted); font-size: 0.8rem; margin: 0.35rem 0 0.65rem; }
    .cex-admin-notes {
      white-space: pre-wrap;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 215, 0, 0.15);
      border-radius: 10px;
      padding: 0.85rem;
      color: var(--text);
      font: inherit;
      font-size: 0.9rem;
    }
    .cex-admin-gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 0.75rem;
      margin-top: 0.75rem;
    }
    .cex-admin-shot {
      margin: 0;
      border: 1px solid rgba(255, 215, 0, 0.2);
      border-radius: 10px;
      overflow: hidden;
      background: #000;
    }
    .cex-admin-shot img { display: block; width: 100%; height: auto; }
    .cex-admin-detail h2 { color: var(--gold); font-size: 1.2rem; }
    .cex-admin-detail h3 { color: var(--aqua); font-size: 0.95rem; margin: 1rem 0 0.45rem; }
  </style>
</head>
<body>
  <header class="site-header" data-forge-member-header="chart-exercises-admin"></header>

  <div class="container" style="max-width:960px">
    <div class="cex-hero">
      <span class="forge-hero-tag">Espace coach · exercices chart</span>
      <h1>Notes &amp; screens des élèves</h1>
      <p>
        Les élèves enregistrent leurs annotations et screens dans l’exercice chart du module.
        Tu les retrouves ici (compte Premium + sync serveur).
      </p>
    </div>
    <div id="chart-exercises-admin-root">
      <p class="fmt-empty">Chargement…</p>
    </div>
  </div>

  <footer data-forge-footer></footer>
  <script src="/js/forge-brand.js"></script>
  <script src="/js/auth.js?v=8"></script>
  <script src="/js/forge-gate.js"></script>
  <script src="/js/forge-chart-exercises-admin.js?v=1"></script>
  <script>
    (function () {
      var root = document.getElementById("chart-exercises-admin-root");
      function fail(msg) {
        if (root) root.innerHTML = '<p class="fmt-empty">' + msg + "</p>";
      }
      if (typeof getMe !== "function") {
        fail("Script auth manquant.");
        return;
      }
      initForgeGate({ requirePremium: true })
        .then(function (me) {
          if (!me) {
            fail("Redirection…");
            return;
          }
          if (!me.isAdmin) {
            fail("Réservé aux admins (FORGE_ADMIN_EMAILS).");
            return;
          }
          return initChartExercisesAdmin();
        })
        .catch(function (err) {
          fail("Erreur : " + (err && err.message ? err.message : String(err)));
        });
    })();
  </script>
  <script src="/js/forge-legal.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Exercices chart élèves — La Forge</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="icon" href="/img/forge-anvil.png" type="image/png" />
  <link rel="stylesheet" href="/css/main.css" />
  <style>
    .cex-hero { margin: 1.5rem 0 1rem; }
    .cex-hero h1 { color: var(--gold); font-size: 1.6rem; margin: 0.35rem 0; }
    .cex-hero p { color: var(--muted); max-width: 42rem; }
    .cex-admin-list { display: grid; gap: 0.85rem; }
    .cex-admin-card {
      border: 1px solid rgba(255, 215, 0, 0.2);
      border-radius: 12px;
      padding: 0.9rem 1rem;
      background: rgba(0, 0, 0, 0.25);
    }
    .cex-admin-meta { color: var(--aqua); font-size: 0.9rem; margin-bottom: 0.35rem; }
    .cex-admin-module {
      color: var(--gold);
      font-size: 1rem;
      font-weight: 600;
      margin: 0.25rem 0 0.5rem;
      line-height: 1.35;
    }
    .cex-admin-module--detail { font-size: 1.05rem; }
    .cex-module-badge {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #111;
      background: var(--gold);
      border-radius: 4px;
      padding: 0.12rem 0.4rem;
      margin-right: 0.35rem;
      vertical-align: middle;
    }
    .cex-module-id {
      font-size: 0.78rem;
      color: var(--muted);
      font-weight: 400;
      margin-left: 0.35rem;
    }
    .cex-admin-preview { color: var(--text); font-size: 0.92rem; margin: 0.35rem 0; }
    .cex-admin-stats { color: var(--muted); font-size: 0.8rem; margin: 0.35rem 0 0.65rem; }
    .cex-admin-notes {
      white-space: pre-wrap;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 215, 0, 0.15);
      border-radius: 10px;
      padding: 0.85rem;
      color: var(--text);
      font: inherit;
      font-size: 0.9rem;
    }
    .cex-admin-gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 0.85rem;
      margin-top: 0.75rem;
    }
    .cex-admin-shot {
      margin: 0;
      border: 1px solid rgba(255, 215, 0, 0.2);
      border-radius: 10px;
      overflow: hidden;
      background: #000;
    }
    .cex-admin-shot:hover { border-color: rgba(255, 215, 0, 0.55); }
    .cex-admin-shot-hit {
      display: block;
      width: 100%;
      padding: 0;
      margin: 0;
      border: 0;
      background: #000;
      cursor: zoom-in;
    }
    .cex-admin-shot img { display: block; width: 100%; height: auto; pointer-events: none; }
    .cex-admin-shot figcaption {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
      justify-content: space-between;
      padding: 0.45rem 0.55rem;
      font-size: 0.78rem;
      color: var(--muted);
      background: rgba(0, 0, 0, 0.45);
    }
    .cex-zoom-btn { font-size: 0.8rem !important; padding: 0.3rem 0.65rem !important; }

    /* Lightbox taille réelle — class toggle (pas [hidden]) */
    .cex-lightbox {
      position: fixed;
      inset: 0;
      z-index: 100000;
      display: none;
      align-items: stretch;
      justify-content: stretch;
    }
    .cex-lightbox.cex-lightbox--open { display: flex !important; }
    .cex-lightbox-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      cursor: zoom-out;
    }
    .cex-lightbox-panel {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .cex-lightbox-bar,
    .cex-lightbox-stage { pointer-events: auto; }
    .cex-lightbox-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1rem;
      background: rgba(12, 14, 18, 0.98);
      border-bottom: 1px solid rgba(255, 215, 0, 0.35);
    }
    .cex-lightbox-caption { color: var(--gold); font-size: 0.92rem; }
    .cex-lightbox-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .cex-lightbox-stage {
      flex: 1;
      overflow: auto;
      padding: 1rem;
      text-align: center;
      -webkit-overflow-scrolling: touch;
    }
    .cex-lightbox-stage img {
      max-width: none !important;
      width: auto !important;
      height: auto !important;
      display: inline-block;
      vertical-align: top;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.55);
    }
    .cex-lightbox-hint {
      color: var(--muted);
      font-size: 0.85rem;
      margin: 0.75rem 0 0;
    }
    .cex-admin-detail h2 { color: var(--gold); font-size: 1.2rem; }
    .cex-admin-detail h3 { color: var(--aqua); font-size: 0.95rem; margin: 1rem 0 0.45rem; }
    .cex-admin-hint { color: var(--muted); font-size: 0.88rem; line-height: 1.5; max-width: 40rem; }
    .cex-admin-toolbar { display: flex; gap: 0.75rem; align-items: center; margin-bottom: 1rem; }
    .cex-admin-empty { margin: 0.5rem 0 1.5rem; }
  </style>
</head>
<body>
  <header class="site-header" data-forge-member-header="chart-exercises-admin"></header>

  <div class="container" style="max-width:960px">
    <div class="cex-hero">
      <span class="forge-hero-tag">Espace coach · exercices chart</span>
      <h1>Notes &amp; screens des élèves</h1>
      <p>
        Chaque entrée indique clairement le <strong>module</strong> (ex. F1 — Participants…).
        Clique un screen pour l’afficher en <strong>taille réelle</strong>.
      </p>
    </div>
    <div id="chart-exercises-admin-root">
      <p class="fmt-empty">Chargement…</p>
    </div>
  </div>

  <footer data-forge-footer></footer>
  <script src="/js/forge-brand.js"></script>
  <script src="/js/auth.js?v=8"></script>
  <script src="/js/forge-gate.js"></script>
  <script src="/js/course-data.js"></script>
  <script src="/js/forge-chart-exercises-admin.js?v=5"></script>
  <script>
    (function () {
      var root = document.getElementById("chart-exercises-admin-root");
      function fail(msg) {
        if (root) root.innerHTML = '<p class="fmt-empty">' + msg + "</p>";
      }
      if (typeof getMe !== "function") {
        fail("Script auth manquant.");
        return;
      }
      initForgeGate({ requirePremium: true })
        .then(function (me) {
          if (!me) {
            fail("Redirection…");
            return;
          }
          if (!me.isAdmin) {
            fail("Réservé aux admins (FORGE_ADMIN_EMAILS).");
            return;
          }
          return initChartExercisesAdmin();
        })
        .catch(function (err) {
          fail("Erreur : " + (err && err.message ? err.message : String(err)));
        });
    })();
  </script>
  <script src="/js/forge-legal.js"></script>
</body>
</html>

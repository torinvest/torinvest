<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mot de passe oublié — TORINVEST La Forge</title>
  <link rel="icon" href="/img/forge-anvil.png" type="image/png" />
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/legal.css" />
</head>
<body>
  <header class="site-header" data-forge-header="connexion"></header>

  <div class="container" style="max-width:440px;padding-top:2rem">
    <div class="card">
      <h2>Mot de passe oublié / nouveau mot de passe</h2>
      <p style="margin-bottom:1rem;color:var(--muted);font-size:0.95rem;line-height:1.55">
        Tu as déjà ta <strong>clé TOR-ACCOMPAGNEMENT</strong> (email Brevo) ?
        Utilise-la pour choisir un mot de passe à toi — sans attendre le support.
      </p>
      <div id="alert" class="alert" hidden></div>
      <form id="reset-form">
        <div class="form-group">
          <label for="email">Email Stripe</label>
          <input type="email" id="email" name="email" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label for="license">Clé TOR-ACCOMPAGNEMENT</label>
          <input type="text" id="license" name="license" required autocomplete="off"
            placeholder="TOR-ACCOMPAGNEMENT-…" spellcheck="false" />
        </div>
        <div class="form-group">
          <label for="newPassword">Nouveau mot de passe (min. 8)</label>
          <input type="password" id="newPassword" name="newPassword" required minlength="8"
            autocomplete="new-password" />
        </div>
        <div class="form-group">
          <label for="newPassword2">Confirmer</label>
          <input type="password" id="newPassword2" name="newPassword2" required minlength="8"
            autocomplete="new-password" />
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;margin-top:0.5rem">
          Enregistrer mon mot de passe
        </button>
      </form>
      <p style="margin-top:1rem;font-size:0.85rem;color:var(--muted);text-align:center">
        <a href="/login.html">Retour connexion</a>
        · Pas de clé ? Contacte le support TORINVEST
      </p>
    </div>
  </div>

  <footer data-forge-footer></footer>
  <script src="/js/forge-brand.js"></script>
  <script src="/js/auth.js?v=8"></script>
  <script>
    document.getElementById("reset-form").addEventListener("submit", async function (e) {
      e.preventDefault();
      const alertEl = document.getElementById("alert");
      const email = document.getElementById("email").value.trim();
      const license = document.getElementById("license").value.trim();
      const newPassword = document.getElementById("newPassword").value;
      const newPassword2 = document.getElementById("newPassword2").value;
      if (newPassword !== newPassword2) {
        showAlert(alertEl, "Les deux mots de passe ne correspondent pas.");
        return;
      }
      try {
        await api("/api/set-password-with-license", {
          method: "POST",
          body: JSON.stringify({ email: email, license: license, newPassword: newPassword }),
        });
        showAlert(alertEl, "Mot de passe enregistré. Connexion…", "success");
        setTimeout(function () {
          window.location.href = "/start.html";
        }, 700);
      } catch (err) {
        showAlert(alertEl, err.message || "Échec");
      }
    });
  </script>
  <script src="/js/forge-legal.js"></script>
</body>
</html>

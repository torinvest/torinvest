<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Masterclass Macro — La Forge</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="icon" href="/img/forge-anvil.png" type="image/png" />
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/forge-masterclass.css?v=2" />
</head>
<body>
  <header class="site-header" data-forge-member-header="masterclass"></header>

  <div class="container mc-wrap">
    <div id="mc-root"><p class="mc-loading">Chargement…</p></div>
    <div id="mc-admin-panel" class="mc-admin" hidden>
      <h2>Administration Masterclass</h2>
      <div id="mc-admin-summary"></div>
      <form id="mc-grant-form">
        <input type="email" name="email" placeholder="email élève à autoriser" required />
        <button type="submit" class="btn btn-secondary btn-sm">Accorder l’accès</button>
      </form>
    </div>
  </div>

  <footer data-forge-footer></footer>
  <script src="/js/forge-brand.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/forge-gate.js"></script>
  <script src="/js/forge-masterclass.js?v=2"></script>
  <script>
    initForgeGate({ requirePremium: false, requireLogin: true }).then(function (me) {
      if (!me) return;
      initMasterclassHub();
    });
  </script>
  <script src="/js/forge-legal.js"></script>
</body>
</html>

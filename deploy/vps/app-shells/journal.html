<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trading Journal — Espace La Forge</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="icon" href="/img/forge-anvil.png" type="image/png" />
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/legal.css" />
  <link rel="stylesheet" href="/css/forge-journal-native.css?v=1" />
</head>
<body>
  <header class="site-header" data-forge-member-header="journal"></header>

  <div class="container" style="max-width:980px">
    <div style="margin:1.25rem 0 0.35rem">
      <span class="forge-hero-tag">Espace membre · journal natif</span>
    </div>
    <div id="journal-native-root">
      <p class="tj-muted">Chargement…</p>
    </div>
  </div>

  <footer data-forge-footer></footer>

  <script src="/js/forge-brand.js"></script>
  <script src="/js/auth.js?v=8"></script>
  <script src="/js/forge-gate.js"></script>
  <script src="/js/forge-journal-native.js?v=1"></script>
  <script>
    (function () {
      var root = document.getElementById("journal-native-root");
      function fail(msg) {
        if (root) root.innerHTML = '<div class="tj-empty">' + msg + "</div>";
      }
      if (typeof getMe !== "function") {
        fail("Script auth manquant — redéploie puis hard refresh.");
        return;
      }
      if (typeof initJournalNative !== "function") {
        fail("Script journal natif manquant — redéploie forge-journal-native.js.");
        return;
      }
      initForgeGate({ requirePremium: true })
        .then(function (me) {
          if (!me) {
            fail("Redirection connexion…");
            return;
          }
          return initJournalNative(me);
        })
        .catch(function (err) {
          fail("Erreur : " + (err && err.message ? err.message : String(err)));
        });
    })();
  </script>
  <script src="/js/forge-legal.js"></script>
</body>
</html>

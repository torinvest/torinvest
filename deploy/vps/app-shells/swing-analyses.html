<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Analyses & scénarios swing — La Forge</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="icon" href="/img/forge-anvil.png" type="image/png" />
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/forge-swing-analyses.css?v=4" />
</head>
<body>
  <header class="site-header" data-forge-member-header="swing-analyses"></header>

  <div class="container" style="max-width:960px">
    <div style="margin:1.25rem 0 0.5rem">
      <span class="forge-hero-tag">Espace membre · swing</span>
    </div>
    <div id="swing-analyses-root">
      <p class="swa-empty">Chargement…</p>
    </div>
  </div>

  <footer data-forge-footer></footer>

  <script src="/js/forge-brand.js"></script>
  <script src="/js/auth.js?v=8"></script>
  <script src="/js/forge-gate.js"></script>
  <script src="/js/forge-swing-analyses.js?v=4"></script>
  <script>
    (function () {
      var root = document.getElementById("swing-analyses-root");
      function fail(msg) {
        if (root) root.innerHTML = '<p class="swa-empty">' + msg + "</p>";
      }
      if (typeof getMe !== "function") {
        fail("Script auth manquant — redéploie puis hard refresh.");
        return;
      }
      initForgeGate({ requirePremium: true })
        .then(function (me) {
          if (!me) {
            fail("Redirection connexion…");
            return;
          }
          return initSwingAnalyses(me);
        })
        .catch(function (err) {
          fail("Erreur : " + (err && err.message ? err.message : String(err)));
        });
    })();
  </script>
  <script src="/js/forge-legal.js"></script>
</body>
</html>

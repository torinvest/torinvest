<!DOCTYPE html>
<html lang="fr">
<head>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7026076448428574"
     crossorigin="anonymous"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mon espace TORINVEST</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/forge-logo.png" />
  <style>
    :root {
      --bg: #070b14;
      --line: rgba(148, 163, 184, 0.28);
      --text: #f8fafc;
      --muted: #94a3b8;
      --amber: #e8b84a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(800px 400px at 0% 0%, rgba(249, 115, 22, 0.16), transparent 50%),
        var(--bg);
      min-height: 100vh;
    }
    .wrap { max-width: 860px; margin: 0 auto; padding: 28px 18px 48px; }
    .top { display: flex; justify-content: space-between; gap: 12px; align-items: center; margin-bottom: 24px; }
    a { color: var(--amber); }
    h1 { margin: 0 0 8px; font-size: 1.7rem; }
    .sub { color: var(--muted); margin: 0 0 20px; font-size: 14px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
    .card {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      background: rgba(16, 24, 38, 0.9);
    }
    .card .k { font-size: 11px; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.06em; }
    .card .v { font-weight: 650; font-size: 14px; }
    .links { display: grid; gap: 10px; margin-top: 22px; }
    .links a {
      display: block;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--line);
      text-decoration: none;
      color: var(--text);
      background: rgba(8, 12, 20, 0.55);
    }
    .links a span { display: block; color: var(--muted); font-size: 12px; margin-top: 4px; }
    button.logout {
      border: 1px solid var(--line);
      background: transparent;
      color: var(--text);
      border-radius: 999px;
      padding: 8px 12px;
      cursor: pointer;
      font: inherit;
      font-size: 13px;
    }
  </style>
</head>
<body data-member-required="1">
  <div class="wrap">
    <div class="top">
      <a href="/" style="color:inherit;text-decoration:none;font-weight:700;letter-spacing:.06em;font-size:13px;">TORINVEST</a>
      <button type="button" class="logout" id="logoutBtn">Déconnexion</button>
    </div>
    <h1>Mon espace</h1>
    <p class="sub">Résumé simple de ton accès membre. Les abonnements € et le TorPass KRM restent séparés.</p>

    <div class="grid">
      <div class="card"><div class="k">Email</div><div class="v" id="mEmail">—</div></div>
      <div class="card"><div class="k">Pseudo</div><div class="v" id="mName">—</div></div>
      <div class="card"><div class="k">Statut</div><div class="v">Membre site</div></div>
    </div>

    <div class="links">
      <a href="/chroniques">Chroniques <span>Articles & analyses</span></a>
      <a href="/formation">Formation <span>Modules</span></a>
      <a href="/video">Vidéos <span>Contenus vidéo</span></a>
      <a href="/torpass">TorPass <span>Niveaux KRM (wallet)</span></a>
      <a href="/#access">Offres € <span>Robot Access & Formation Trading</span></a>
    </div>
  </div>

  <script src="/assets/torinvest-php.js"></script>
  <script src="/assets/torinvest-member-auth.js?v=1"></script>
  <script>
    document.getElementById("logoutBtn").addEventListener("click", function () {
      window.TorinvestMember.logout().then(function () {
        window.location.href = "/";
      });
    });
    window.TorinvestMember.me().then(function (data) {
      if (!data || !data.member) return;
      document.getElementById("mEmail").textContent = data.member.email || "—";
      document.getElementById("mName").textContent = data.member.displayName || "—";
    });
  </script>
</body>
</html>
